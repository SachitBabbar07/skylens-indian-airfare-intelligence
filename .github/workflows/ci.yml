name: Portable software checks

on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'research/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skylens-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    if: ${{ vars.SKYLENS_CI_ZERO_SPEND_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - run: python -m compileall -q src backend scripts
      - run: python -m pytest tests/test_quotes.py tests/test_portable_contract.py -q
      - run: python scripts/repository_guard.py --history
      - run: python scripts/check_docs.py

  frontend:
    if: ${{ vars.SKYLENS_CI_ZERO_SPEND_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci --no-fund
      - run: npm --prefix frontend run build
